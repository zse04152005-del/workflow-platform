spring:
  application:
    name: workflow-control-plane
  kafka:
    bootstrap-servers: ${WORKFLOW_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
  mvc:
    problemdetails:
      enabled: true
  config:
    import: optional:file:.env[.properties]
  lifecycle:
    timeout-per-shutdown-phase: 30s
  profiles:
    default: local

server:
  shutdown: graceful

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

workflow:
  kafka:
    publisher-enabled: ${WORKFLOW_KAFKA_PUBLISHER_ENABLED:false}
    task-ready-topic: ${WORKFLOW_TASK_READY_TOPIC:workflow.task.ready}
    events-topic: ${WORKFLOW_EVENTS_TOPIC:workflow.events}
