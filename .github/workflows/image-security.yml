name: Image security and release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
  id-token: write
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: control-plane
            dockerfile: control-plane/Dockerfile
          - image: worker
            dockerfile: worker/Dockerfile
          - image: web-console
            dockerfile: web-console/Dockerfile
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with: { persist-credentials: false }
      - name: Resolve immutable image reference
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.image }}:${GITHUB_SHA}"
          echo "IMAGE_REF=${image}" >> "${GITHUB_ENV}"
      - name: Build immutable SHA image
        run: docker build --label "org.opencontainers.image.revision=${GITHUB_SHA}" -f "${{ matrix.dockerfile }}" -t "${IMAGE_REF}" .
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ env.IMAGE_REF }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.image }}.cdx.json
          artifact-name: sbom-${{ matrix.image }}.cdx.json
      - name: Scan vulnerabilities and licenses
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE_REF }}
          scanners: vuln,license
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Authenticate to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Push immutable image
        run: docker push "${IMAGE_REF}"
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Sign image and attest SBOM
        shell: bash
        run: |
          cosign sign --yes "${IMAGE_REF}"
          cosign attest --yes --predicate "sbom-${{ matrix.image }}.cdx.json" --type cyclonedx "${IMAGE_REF}"
