{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: {{ include "workflow-platform.fullname" . }} }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: {{ include "workflow-platform.name" . }} } }
  policyTypes: [Ingress, Egress]
  ingress: [{ from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: workflow-platform } } }], ports: [{ protocol: TCP, port: 8080 }] }]
  egress: [{ to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: workflow-platform } } }] }]
{{- end }}
